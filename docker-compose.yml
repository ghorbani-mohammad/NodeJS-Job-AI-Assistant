services:
  app:
    container_name: nodejs-job-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8126:8126
    depends_on:
      - mongodb
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped

  mongodb:
    container_name: nodejs-job-mongodb
    image: mongo:7.0
    volumes:
      - ./mongodb_data:/data/db
    env_file:
      - .env
    command:
      - mongod
      - --quiet # reduce log output
      - --wiredTigerCacheSizeGB
      - "0.25"
      - --setParameter
      - maxTransactionLockRequestTimeoutMillis=5000
      - --setParameter
      - enableLocalhostAuthBypass=false
      - --wiredTigerJournalCompressor=none
      - --wiredTigerCollectionBlockCompressor=none
      - --wiredTigerIndexPrefixCompression=false
      - --syncdelay=0
    ulimits:
      nproc: 65536
      nofile: { soft: 20000, hard: 40000 }
    restart: unless-stopped
    mem_limit: "512m"
    cpus: "0.2"
