services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8126:8126
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    volumes:
      - ./mongodb_data:/data/db
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
